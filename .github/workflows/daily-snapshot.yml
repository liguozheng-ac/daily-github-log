name: Daily snapshot

on:
  schedule:
    # UTC: 01:17, 07:17, 13:17 = Beijing 09:17, 15:17, 21:17.
    - cron: '17 1,7,13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - name: Capture public repository snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_OWNER: liguozheng-ac
        run: node scripts/daily-snapshot.mjs
      - name: Commit daily snapshot
        shell: bash
        run: |
          set -euo pipefail
          git add snapshots/
          if git diff --cached --quiet; then
            echo "Today's snapshot already exists."
            exit 0
          fi
          git config user.name "liguozheng-ac"
          git config user.email "322033022+liguozheng-ac@users.noreply.github.com"
          git commit -m "chore: automated public repository snapshot $(date +%F)"
          git push origin HEAD:main
